nue; }\n      for (const a of [...c.attributes]) if (!(c.tagName === 'IMG' && a.name === 'src' && /^https?:/i.test(a.value))) c.removeAttribute(a.name);\n      if (c.tagName === 'IMG') { c.loading = 'lazy'; c.referrerPolicy = 'no-referrer'; c.dataset.zoom = c.src; }\n      walk(c);\n    }\n  })(doc.body);\n  return doc.body.innerHTML || '<span class=\"muted\">Không có mô tả.<\/span>';\n}\n\n// ---------- category ----------\nfunction renderCategory() {\n  const top = new Set(P.map(p => p.sku));\n  const rows = DATA.catList.map((c, i) => `<tr${top.has(c.sku) ? ' style=\"background:var(--accent-soft)\"' : ''}>\n    <td class=\"r num muted\" data-v=\"${i + 1}\">${i + 1}<\/td>\n    <td>${img(c.bigImage, 'thumb', `data-zoom=\"${esc(c.bigImage)}\"`)}<\/td>\n    <td>${top.has(c.sku) ? `<a href=\"#${c.sku}\"><b>${esc(c.sku)}<\/b><\/a>` : esc(c.sku)}<\/td>\n    <td style=\"min-width:260px\">${esc(c.nameEn)}<\/td>\n    <td class=\"r num\" data-v=\"${c.listedNum ?? 0}\">${fmt(c.listedNum)}<\/td>\n    <td class=\"r num\" style=\"white-space:nowrap\" data-v=\"${parseFloat(c.sellPrice) || 0}\">${esc(String(c.sellPrice ?? '').replace(/\\s*--\\s*/, ' – '))}<\/td>\n    <td class=\"r num\" data-v=\"${c.inv ?? 0}\">${fmt(c.inv)}<\/td>\n    <td class=\"r num\" data-v=\"${c.verified ?? 0}\">${fmt(c.verified)}<\/td>\n    <td>${c.video ? '▶' : ''}<\/td>\n    <td style=\"white-space:nowrap\">${c.url ? `<a href=\"${esc(c.url)}\" target=\"_blank\" rel=\"noopener\">CJ ↗<\/a>` : ''}<\/td>\n  <\/tr>`).join('');\n  return `<div class=\"section\"><h2>Tất cả sản phẩm trong danh mục <small>${DATA.catList.length} sản phẩm · dòng tô màu là top 5 · bấm tiêu đề cột để sắp xếp<\/small><\/h2>\n    <div class=\"toolbar\"><input class=\"search\" id=\"cSearch\" placeholder=\"Lọc theo tên / SKU…\"><\/div>\n    <div class=\"card tbl-wrap\" style=\"max-height:75vh\"><table data-sortable id=\"cTable\">\n      <thead><tr><th class=\"sort r\">#<\/th><th><\/th><th class=\"sort\">SKU<\/th><th class=\"sort\">Tên<\/th><th class=\"sort r\">Shop đã list<\/th><th class=\"sort r\">Giá sỉ<\/th><th class=\"sort r\">Tồn kho<\/th><th class=\"sort r\">Tồn CJ<\/th><th>Video<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${rows}<\/tbody><\/table><\/div><\/div>`;\n}\n\n// ---------- interactions ----------\nfunction makeSortable(tbl) {\n  const ths = [...tbl.tHead.rows[0].cells];\n  ths.forEach((th, idx) => {\n    if (!th.classList.contains('sort')) return;\n    th.addEventListener('click', () => {\n      const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';\n      ths.forEach(h => delete h.dataset.dir); th.dataset.dir = dir;\n      const body = tbl.tBodies[0], rows = [...body.rows];\n      const key = r => { const c = r.cells[idx]; if (!c) return ''; const v = c.dataset.v; return v !== undefined && v !== '' && !isNaN(v) ? +v : c.textContent.trim().toLowerCase(); };\n      rows.sort((a, b) => { const x = key(a), y = key(b); const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y)); return dir === 'asc' ? r : -r; });\n      rows.forEach(r => body.appendChild(r));\n    });\n  });\n}\nfunction filterTable(input, tbl) {\n  input?.addEventListener('input', () => {\n    const q = input.value.trim().toLowerCase();\n    for (const r of tbl.tBodies[0].rows) r.style.display = !q || r.textContent.toLowerCase().includes(q) ? '' : 'none';\n  });\n}\n\nfunction wire(root, id) {\n  root.querySelectorAll('[data-go]').forEach(el => el.onclick = () => location.hash = el.dataset.go);\n  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {\n    try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = 'Đã copy ✓'; setTimeout(() => b.textContent = t, 1200); } catch {}\n  });\n  filterTable($('#vSearch', root), $('#vTable', root));\n  filterTable($('#cSearch', root), $('#cTable', root));\n\n  const p = P.find(x => x.sku === id);\n  if (p) {\n    $('#desc', root).innerHTML = sanitize(p.d.description || p.s.description);\n    let cur = 0;\n    const strip = $('#gStrip', root), main = $('#gMain img', root);\n    const show = i => { cur = i; main.src = p.images[i]; strip.querySelectorAll('img').forEach((im, j) => im.classList.toggle('on', j === i)); strip.children[i]?.scrollIntoView({ block: 'nearest', inline: 'nearest' }); };\n    strip.onclick = e => { const im = e.target.closest('img[data-i]'); if (im) show(+im.dataset.i); };\n    $('#gMain', root).onclick = () => openLb(p.images, cur);\n    root.querySelectorAll('details[data-raw]').forEach(dt => dt.addEventListener('toggle', () => {\n      const pre = dt.querySelector('pre'); if (dt.open && !pre.textContent) pre.textContent = JSON.stringify(p.raw[dt.dataset.raw], null, 2);\n    }));\n  }\n  // zoomable images (variants, reviews, description, category)\n  root.addEventListener('click', e => {\n    const im = e.target.closest('img[data-zoom]'); if (!im) return;\n    const scope = im.closest('.imgs, #desc, tbody') || root;\n    const list = [...scope.querySelectorAll('img[data-zoom]')].map(x => x.dataset.zoom);\n    openLb(list, list.indexOf(im.dataset.zoom));\n  });\n}\n\n// ---------- lightbox ----------\nconst lb = $('#lb'); let lbList = [], lbI = 0;\nfunction openLb(list, i) { lbList = list; lbShow(Math.max(0, i)); lb.classList.add('on'); }\nfunction lbShow(i) { lbI = (i + lbList.length) % lbList.length; $('img', lb).src = lbList[lbI]; $('.ct', lb).textContent = `${lbI + 1} / ${lbList.length}`; }\nlb.onclick = e => { if (e.target === lb || e.target.classList.contains('x')) lb.classList.remove('on'); };\n$('.pv', lb).onclick = () => lbShow(lbI - 1);\n$('.nx', lb).onclick = () => lbShow(lbI + 1);\naddEventListener('keydown', e => {\n  if (!lb.classList.contains('on')) return;\n  if (e.key === 'Escape') lb.classList.remove('on');\n  if (e.key === 'ArrowLeft') lbShow(lbI - 1);\n  if (e.key === 'ArrowRight') lbShow(lbI + 1);\n});\n\nroute();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "CJ_02", "name": "Pet Training and ice)}<\/td>\n    <td class=\"r num\" data-v=\"${v.variantSugSellPrice}\">${money(v.variantSugSellPrice)}<\/td>\n    <td class=\"r num\" data-v=\"${v.margin ?? ''}\">${v.margin ? '×' + v.margin.toFixed(1) : '—'}<\/td>\n    <td class=\"r num\" data-v=\"${v.variantWeight}\">${fmt(v.variantWeight)}<\/td>\n    <td class=\"r num\" data-v=\"${v.variantVolume ?? ''}\">${[v.variantLength, v.variantWidth, v.variantHeight].every(x => x != null) ? `${v.variantLength}×${v.variantWidth}×${v.variantHeight}` : '—'}<\/td>\n    <td class=\"r num\" data-v=\"${v.invCN ?? -1}\">${fmt(v.invCN)}<\/td>\n    <td class=\"r num\" data-v=\"${v.invUS ?? -1}\">${fmt(v.invUS)}<\/td>\n    <td class=\"muted num\">${esc(v.barcode)}<\/td>\n    <td class=\"muted num\" data-v=\"${v.createTime}\">${day(v.createTime)}<\/td>\n  <\/tr>`).join('');\n\n  const variantVids = new Set(p.variants.map(v => v.vid));\n  const orphanVids = Object.keys(p.invByVid).filter(v => !variantVids.has(v));\n\n  const invCards = (p.inv.inventories || []).map(i => `<div class=\"card\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\"><b>${esc(i.areaEn || i.countryNameEn)}<\/b><span class=\"pill\">${esc(i.countryCode)}<\/span><\/div>\n      <dl class=\"kv\" style=\"margin-top:6px\">\n        <dt>Tổng<\/dt><dd><b>${fmt(i.totalInventoryNum)}<\/b><\/dd>\n        <dt>Kho CJ<\/dt><dd>${fmt(i.cjInventoryNum)}<\/dd>\n        <dt>Kho nhà máy<\/dt><dd>${fmt(i.factoryInventoryNum)}<\/dd>\n      <\/dl><\/div>`).join('') || '<div class=\"empty\">Không có dữ liệu tồn kho.<\/div>';\n\n  const dist = [5, 4, 3, 2, 1].map(n => { const c = p.reviews.filter(r => r.score === n).length; return { n, c }; });\n  const maxC = Math.max(1, ...dist.map(x => x.c));\n  const reviews = p.reviews.slice().sort((a, b) => new Date(b.commentDate) - new Date(a.commentDate)).map(r => `<div class=\"card rv\">\n      <div class=\"h\">${r.flagIconUrl ? img(r.flagIconUrl) : ''}<b>${esc(r.commentUser)}<\/b><span class=\"pill\">${esc(r.countryCode)}<\/span><span class=\"stars\">${stars(r.score)}<\/span><span class=\"d\">${day(r.commentDate)}<\/span><\/div>\n      ${r.comment ? `<div class=\"c\">${esc(decodeEnt(r.comment))}<\/div>` : '<div class=\"c muted\">(không có nội dung)<\/div>'}\n      ${(r.commentUrls || []).length ? `<div class=\"imgs\">${r.commentUrls.map(u => img(u, '', `data-zoom=\"${esc(u)}\" data-group=\"rv\"`)).join('')}<\/div>` : ''}\n    <\/div>`).join('');\n\n  const rawSections = ['search_products', 'get_product_detail', 'get_product_inventory', 'get_product_reviews'];\n\n  return `\n  <div class=\"p-head\">\n    <div class=\"gallery\">\n      <div class=\"main\" id=\"gMain\">${img(p.images[0])}<\/div>\n      <div class=\"strip\" id=\"gStrip\">${p.images.map((u, i) => img(u, i ? '' : 'on', `data-i=\"${i}\"`)).join('')}<\/div>\n      <div class=\"count\">${p.images.length} ảnh · bấm ảnh lớn để phóng to, dùng phím ← → để chuyển<\/div>\n    <\/div>\n    <div class=\"p-info\">\n      <h2>${esc(p.name)}<\/h2>\n      <div class=\"tags\"><span class=\"pill acc\">#${p.rank} theo listedNum<\/span><span class=\"pill\">${esc(p.sku)}<\/span>${p.videos.length ? `<span class=\"pill\">${p.videos.length} video<\/span>` : ''}${(d.productProEnSet || []).map(x => `<span class=\"pill\">${esc(x)}<\/span>`).join('')}<\/div>\n      <div class=\"stats\">\n        <div class=\"card stat\"><div class=\"l\">Shop đã list<\/div><div class=\"v\">${fmt(s.listedNum ?? d.listedNum)}<\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Giá sỉ<\/div><div class=\"v\">${money(p.minPrice)} <small>– ${money(p.maxPrice)}<\/small><\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Biến thể<\/div><div class=\"v\">${p.variants.length}<\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Tổng tồn kho<\/div><div class=\"v\">${fmt(p.totalInv)}<\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Đánh giá<\/div><div class=\"v\">${p.reviews.length ? `${p.avg.toFixed(2)}${p.revPartial ? '*' : ''} <small>/ ${fmt(p.revTotal)} lượt<\/small>` : '—'}<\/div><\/div>\n      <\/div>\n      <div class=\"card facts\"><dl class=\"kv\">${facts.map(([k, v]) => `<dt>${k}<\/dt><dd>${esc(v)}<\/dd>`).join('')}<\/dl><\/div>\n      <div class=\"actions\">\n        ${d.productUrl || s.productUrl ? `<a class=\"btn primary\" href=\"${esc(d.productUrl || s.productUrl)}\" target=\"_blank\" rel=\"noopener\">Mở trên CJ ↗<\/a>` : ''}\n        <button class=\"btn\" data-copy=\"${esc(d.pid)}\">Copy PID<\/button>\n        <button class=\"btn\" data-copy=\"${esc(p.sku)}\">Copy SKU<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"section\"><h2>Biến thể <small>${p.variants.length} biến thể · bấm tiêu đề cột để sắp xếp · tồn kho gộp theo vid<\/small><\/h2>\n    <div class=\"toolbar\"><input class=\"search\" id=\"vSearch\" placeholder=\"Lọc theo tên / SKU biến thể…\"><\/div>\n    <div class=\"card tbl-wrap\"><table data-sortable id=\"vTable\">\n      <thead><tr><th><\/th><th class=\"sort\">Biến thể<\/th><th class=\"sort\">Variant SKU<\/th><th class=\"sort r\">Giá sỉ<\/th><th class=\"sort r\">Giá gợi ý<\/th><th class=\"sort r\" title=\"Giá gợi ý / giá sỉ\">Hệ số<\/th><th class=\"sort r\">Nặng (g)<\/th><th class=\"sort r\">D×R×C (mm)<\/th><th class=\"sort r\">Tồn CN<\/th><th class=\"sort r\">Tồn US<\/th><th>Barcode<\/th><th class=\"sort\">Ngày tạo<\/th><\/tr><\/thead>\n      <tbody>${variantRows || '<tr><td colspan=\"12\" class=\"empty\">Không có biến thể.<\/td><\/tr>'}<\/tbody>\n    <\/table><\/div>\n    ${orphanVids.length ? `<div class=\"muted\" style=\"font-size:12px;margin-top:6px\">Có ${orphanVids.length} vid chỉ xuất hiện trong dữ liệu tồn kho, không có trong danh sách biến thể: ${orphanVids.map(esc).join(', ')}<\/div>` : ''}\n  <\/div>\n\n  <div class=\"section\"><h2>Tồn kho theo kho<\/h2><div class=\"inv-grid\">${invCards}<\/div><\/div>\n\n  <div class=\"section\"><h2>Mô tả sản phẩm<\/h2><div class=\"card desc\" id=\"desc\"><\/div><\/div>\n\n  <div class=\"section\"><h2>Đánh giá <small>${p.revPartial ? `mới lấy ${p.reviews.length}/${fmt(p.revTotal)}` : p.reviews.length} đánh giá${p.avg ? ` · trung bình ${p.avg.toFixed(2)}` : ''}<\/small><\/h2>\n    ${p.revPartial ? `<div class=\"note\" style=\"margin:0 0 10px\">⚠ Mới lấy được ${p.reviews.length} trên ${fmt(p.revTotal)} đánh giá, nên điểm trung bình và phân bố sao chỉ tính trên phần đã lấy.<\/div>` : ''}\n    ${p.reviews.length ? `<div class=\"card\" style=\"padding:12px 14px;margin-bottom:10px;display:inline-block\"><div class=\"dist\">${dist.map(x => `<div class=\"row\"><span style=\"width:22px\">${x.n}★<\/span><span class=\"bar\"><i style=\"width:${x.c / maxC * 100}%\"><\/i><\/span><span class=\"num\" style=\"width:24px;text-align:right\">${x.c}<\/span><\/div>`).join('')}<\/div><\/div>\n    <div class=\"reviews\">${reviews}<\/div>` : '<div class=\"card empty\">Chưa có đánh giá.<\/div>'}\n  <\/div>\n\n  ${p.videos.length ? `<div class=\"section\"><h2>Video <small>ID video CJ trả về (xem video trên trang sản phẩm CJ)<\/small><\/h2><div class=\"card\" style=\"padding:10px 14px;font-size:12.5px\">${p.videos.map(v => `<div class=\"num muted\">${esc(typeof v === 'string' ? v : JSON.stringify(v))}<\/div>`).join('')}<\/div><\/div>` : ''}\n\n  <div class=\"section\"><h2>Dữ liệu gốc (JSON)<\/h2>\n    ${rawSections.map(k => `<details class=\"card raw\" data-raw=\"${k}\"><summary>${k}<\/summary><pre><\/pre><\/details>`).join('')}\n  <\/div>`;\n}\n\nfunction decodeEnt(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }\n\n// Keep only harmless formatting tags from the CJ description HTML.\nfunction sanitize(html) {\n  const doc = new DOMParser().parseFromString(html || '', 'text/html');\n  const ok = new Set(['P','B','STRONG','I','EM','U','BR','UL','OL','LI','SPAN','DIV','IMG','H1','H2','H3','H4','H5','H6','TABLE','THEAD','TBODY','TR','TD','TH','FONT']);\n  (function walk(n) {\n    for (const c of [...n.children]) {\n      if (!ok.has(c.tagName)) { c.replaceWith(...(['SCRIPT','STYLE','IFRAME','OBJECT'].includes(c.tagName) ? [] : c.childNodes)); continue; }\n      for (const a of [...c.attributes]) if (!(c.tagName === 'IMG' && a.name === 'src' && /^https?:/i.test(a.value))) c.removeAttribute(a.name);\n      if (c.tagName === 'IMG') { c.loading = 'lazy'; c.referrerPolicy = 'no-referrer'; c.dataset.zoom = c.src; }\n      walk(c);\n    }\n  })(doc.body);\n  return doc.body.innerHTML || '<span class=\"muted\">Không có mô tả.<\/span>';\n}\n\n// ---------- category ----------\nfunction renderCategory() {\n  const top = new Set(P.map(p => p.sku));\n  const rows = DATA.catList.map((c, i) => `<tr${top.has(c.sku) ? ' style=\"background:var(--accent-soft)\"' : ''}>\n    <td class=\"r num muted\" data-v=\"${i + 1}\">${i + 1}<\/td>\n    <td>${img(c.bigImage, 'thumb', `data-zoom=\"${esc(c.bigImage)}\"`)}<\/td>\n    <td>${top.has(c.sku) ? `<a href=\"#${c.sku}\"><b>${esc(c.sku)}<\/b><\/a>` : esc(c.sku)}<\/td>\n    <td style=\"min-width:260px\">${esc(c.nameEn)}<\/td>\n    <td class=\"r num\" data-v=\"${c.listedNum ?? 0}\">${fmt(c.listedNum)}<\/td>\n    <td class=\"r num\" style=\"white-space:nowrap\" data-v=\"${parseFloat(c.sellPrice) || 0}\">${esc(String(c.sellPrice ?? '').replace(/\\s*--\\s*/, ' – '))}<\/td>\n    <td class=\"r num\" data-v=\"${c.inv ?? 0}\">${fmt(c.inv)}<\/td>\n    <td class=\"r num\" data-v=\"${c.verified ?? 0}\">${fmt(c.verified)}<\/td>\n    <td>${c.video ? '▶' : ''}<\/td>\n    <td style=\"white-space:nowrap\">${c.url ? `<a href=\"${esc(c.url)}\" target=\"_blank\" rel=\"noopener\">CJ ↗<\/a>` : ''}<\/td>\n  <\/tr>`).join('');\n  return `<div class=\"section\"><h2>Tất cả sản phẩm trong danh mục <small>${DATA.catList.length} sản phẩm · dòng tô màu là top 5 · bấm tiêu đề cột để sắp xếp<\/small><\/h2>\n    <div class=\"toolbar\"><input class=\"search\" id=\"cSearch\" placeholder=\"Lọc theo tên / SKU…\"><\/div>\n    <div class=\"card tbl-wrap\" style=\"max-height:75vh\"><table data-sortable id=\"cTable span class=\"pill\">${p.videos.length} video<\/span>` : ''}${(d.productProEnSet || []).map(x => `<span class=\"pill\">${esc(x)}<\/span>`).join('')}<\/div>\n      <div class=\"stats\">\n        <div class=\"card stat\"><div class=\"l\">Shop đã list<\/div><div class=\"v\">${fmt(s.listedNum ?? d.listedNum)}<\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Giá sỉ<\/div><div class=\"v\">${money(p.minPrice)} <small>– ${money(p.maxPrice)}<\/small><\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Biến thể<\/div><div class=\"v\">${p.variants.length}<\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Tổng tồn kho<\/div><div class=\"v\">${fmt(p.totalInv)}<\/div><\/div>\n        <div class=\"card stat\"><div class=\"l\">Đánh giá<\/div><div class=\"v\">${p.reviews.length ? `${p.avg.toFixed(2)}${p.revPartial ? '*' : ''} <small>/ ${fmt(p.revTotal)} lượt<\/small>` : '—'}<\/div><\/div>\n      <\/div>\n      <div class=\"card facts\"><dl class=\"kv\">${facts.map(([k, v]) => `<dt>${k}<\/dt><dd>${esc(v)}<\/dd>`).join('')}<\/dl><\/div>\n      <div class=\"actions\">\n        ${d.productUrl || s.productUrl ? `<a class=\"btn primary\" href=\"${esc(d.productUrl || s.productUrl)}\" target=\"_blank\" rel=\"noopener\">Mở trên CJ ↗<\/a>` : ''}\n        <button class=\"btn\" data-copy=\"${esc(d.pid)}\">Copy PID<\/button>\n        <button class=\"btn\" data-copy=\"${esc(p.sku)}\">Copy SKU<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"section\"><h2>Biến thể <small>${p.variants.length} biến thể · bấm tiêu đề cột để sắp xếp · tồn kho gộp theo vid<\/small><\/h2>\n    <div class=\"toolbar\"><input class=\"search\" id=\"vSearch\" placeholder=\"Lọc theo tên / SKU biến thể…\"><\/div>\n    <div class=\"card tbl-wrap\"><table data-sortable id=\"vTable\">\n      <thead><tr><th><\/th><th class=\"sort\">Biến thể<\/th><th class=\"sort\">Variant SKU<\/th><th class=\"sort r\">Giá sỉ<\/th><th class=\"sort r\">Giá gợi ý<\/th><th class=\"sort r\" title=\"Giá gợi ý / giá sỉ\">Hệ số<\/th><th class=\"sort r\">Nặng (g)<\/th><th class=\"sort r\">D×R×C (mm)<\/th><th class=\"sort r\">Tồn CN<\/th><th class=\"sort r\">Tồn US<\/th><th>Barcode<\/th><th class=\"sort\">Ngày tạo<\/th><\/tr><\/thead>\n      <tbody>${variantRows || '<tr><td colspan=\"12\" class=\"empty\">Không có biến thể.<\/td><\/tr>'}<\/tbody>\n    <\/table><\/div>\n    ${orphanVids.length ? `<div class=\"muted\" style=\"font-size:12px;margin-top:6px\">Có ${orphanVids.length} vid chỉ xuất hiện trong dữ liệu tồn kho, không có trong danh sách biến thể: ${orphanVids.map(esc).join(', ')}<\/div>` : ''}\n  <\/div>\n\n  <div class=\"section\"><h2>Tồn kho theo kho<\/h2><div class=\"inv-grid\">${invCards}<\/div><\/div>\n\n  <div class=\"section\"><h2>Mô tả sản phẩm<\/h2><div class=\"card desc\" id=\"desc\"><\/div><\/div>\n\n  <div class=\"section\"><h2>Đánh giá <small>${p.revPartial ? `mới lấy ${p.reviews.length}/${fmt(p.revTotal)}` : p.reviews.length} đánh giá${p.avg ? ` · trung bình ${p.avg.toFixed(2)}` : ''}<\/small><\/h2>\n    ${p.revPartial ? `<div class=\"note\" style=\"margin:0 0 10px\">⚠ Mới lấy được ${p.reviews.length} trên ${fmt(p.revTotal)} đánh giá, nên điểm trung bình và phân bố sao chỉ tính trên phần đã lấy.<\/div>` : ''}\n    ${p.reviews.length ? `<div class=\"card\" style=\"padding:12px 14px;margin-bottom:10px;display:inline-block\"><div class=\"dist\">${dist.map(x => `<div class=\"row\"><span style=\"width:22px\">${x.n}★<\/span><span class=\"bar\"><i style=\"width:${x.c / maxC * 100}%\"><\/i><\/span><span class=\"num\" style=\"width:24px;text-align:right\">${x.c}<\/span><\/div>`).join('')}<\/div><\/div>\n    <div class=\"reviews\">${reviews}<\/div>` : '<div class=\"card empty\">Chưa có đánh giá.<\/div>'}\n  <\/div>\n\n  ${p.videos.length ? `<div class=\"section\"><h2>Video <small>ID video CJ trả về (xem video trên trang sản phẩm CJ)<\/small><\/h2><div class=\"card\" style=\"padding:10px 14px;font-size:12.5px\">${p.videos.map(v => `<div class=\"num muted\">${esc(typeof v === 'string' ? v : JSON.stringify(v))}<\/div>`).join('')}<\/div><\/div>` : ''}\n\n  <div class=\"section\"><h2>Dữ liệu gốc (JSON)<\/h2>\n    ${rawSections.map(k => `<details class=\"card raw\" data-raw=\"${k}\"><summary>${k}<\/summary><pre><\/pre><\/details>`).join('')}\n  <\/div>`;\n}\n\nfunction decodeEnt(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }\n\n// Keep only harmless formatting tags from the CJ description HTML.\nfunction sanitize(html) {\n  const doc = new DOMParser().parseFromString(html || '', 'text/html');\n  const ok = new Set(['P','B','STRONG','I','EM','U','BR','UL','OL','LI','SPAN','DIV','IMG','H1','H2','H3','H4','H5','H6','TABLE','THEAD','TBODY','TR','TD','TH','FONT']);\n  (function walk(n) {\n    for (const c of [...n.children]) {\n      if (!ok.has(c.tagName)) { c.replaceWith(...(['SCRIPT','STYLE','IFRAME','OBJECT'].includes(c.tagName) ? [] : c.childNodes)); continue; }\n      for (const a of [...c.attributes]) if (!(c.tagName === 'IMG' && a.name === 'src' && /^https?:/i.test(a.value))) c.removeAttribute(a.name);\n      if (c.tagName === 'IMG') { c.loading = 'lazy'; c.referrerPolicy = 'no-referrer'; c.dataset.zoom = c.src; }\n      walk(c);\n    }\n  })(doc.body);\n  return doc.body.innerHTML || '<span class=\"muted\">Không có mô tả.<\/span>';\n}\n\n// ---------- category ----------\nfunction renderCategory() {\n  const top = new Set(P.map(p => p.sku));\n  const rows = DATA.catList.map((c, i) => `<tr${top.has(c.sku) ? ' style=\"background:var(--accent-soft)\"' : ''}>\n    <td class=\"r num muted\" data-v=\"${i + 1}\">${i + 1}<\/td>\n    <td>${img(c.bigImage, 'thumb', `data-zoom=\"${esc(c.bigImage)}\"`)}<\/td>\n    <td>${top.has(c.sku) ? `<a href=\"#${c.sku}\"><b>${esc(c.sku)}<\/b><\/a>` : esc(c.sku)}<\/td>\n    <td style=\"min-width:260px\">${esc(c.nameEn)}<\/td>\n    <td class=\"r num\" data-v=\"${c.listedNum ?? 0}\">${fmt(c.listedNum)}<\/td>\n    <td class=\"r num\" style=\"white-space:nowrap\" data-v=\"${parseFloat(c.sellPrice) || 0}\">${esc(String(c.sellPrice ?? '').replace(/\\s*--\\s*/, ' – '))}<\/td>\n    <td class=\"r num\" data-v=\"${c.inv ?? 0}\">${fmt(c.inv)}<\/td>\n    <td class=\"r num\" data-v=\"${c.verified ?? 0}\">${fmt(c.verified)}<\/td>\n    <td>${c.video ? '▶' : ''}<\/td>\n    <td style=\"white-space:nowrap\">${c.url ? `<a href=\"${esc(c.url)}\" target=\"_blank\" rel=\"noopener\">CJ ↗<\/a>` : ''}<\/td>\n  <\/tr>`).join('');\n  return `<div class=\"section\"><h2>Tất cả sản phẩm trong danh mục <small>${DATA.catList.length} sản phẩm · dòng tô màu là top 5 · bấm tiêu đề cột để sắp xếp<\/small><\/h2>\n    <div class=\"toolbar\"><input class=\"search\" id=\"cSearch\" placeholder=\"Lọc theo tên / SKU…\"><\/div>\n    <div class=\"card tbl-wrap\" style=\"max-height:75vh\"><table data-sortable id=\"cTable\">\n      <thead><tr><th class=\"sort r\">#<\/th><th><\/th><th class=\"sort\">SKU<\/th><th class=\"sort\">Tên<\/th><th class=\"sort r\">Shop đã list<\/th><th class=\"sort r\">Giá sỉ<\/th><th class=\"sort r\">Tồn kho<\/th><th class=\"sort r\">Tồn CJ<\/th><th>Video<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${rows}<\/tbody><\/table><\/div><\/div>`;\n}\n\n// ---------- interactions ----------\nfunction makeSortable(tbl) {\n  const ths = [...tbl.tHead.rows[0].cells];\n  ths.forEach((th, idx) => {\n    if (!th.classList.contains('sort')) return;\n    th.addEventListener('click', () => {\n      const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';\n      ths.forEach(h => delete h.dataset.dir); th.dataset.dir = dir;\n      const body = tbl.tBodies[0], rows = [...body.rows];\n      const key = r => { const c = r.cells[idx]; if (!c) return ''; const v = c.dataset.v; return v !== undefined && v !== '' && !isNaN(v) ? +v : c.textContent.trim().toLowerCase(); };\n      rows.sort((a, b) => { const x = key(a), y = key(b); const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y)); return dir === 'asc' ? r : -r; });\n      rows.forEach(r => body.appendChild(r));\n    });\n  });\n}\nfunction filterTable(input, tbl) {\n  input?.addEventListener('input', () => {\n    const q = input.value.trim().toLowerCase();\n    for (const r of tbl.tBodies[0].rows) r.style.display = !q || r.textContent.toLowerCase().includes(q) ? '' : 'none';\n  });\n}\n\nfunction wire(root, id) {\n  root.querySelectorAll('[data-go]').forEach(el => el.onclick = () => location.hash = el.dataset.go);\n  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {\n    try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = 'Đã copy ✓'; setTimeout(() => b.textContent = t, 1200); } catch {}\n  });\n  filterTable($('#vSearch', root), $('#vTable', root));\n  filterTable($('#cSearch', root), $('#cTable', root));\n\n  const p = P.find(x => x.sku === id);\n  if (p) {\n    $('#desc', root).innerHTML = sanitize(p.d.description || p.s.description);\n    let cur = 0;\n    const strip = $('#gStrip', root), main = $('#gMain img', root);\n    const show = i => { cur = i; main.src = p.images[i]; strip.querySelectorAll('img').forEach((im, j) => im.classList.toggle('on', j === i)); strip.children[i]?.scrollIntoView({ block: 'nearest', inline: 'nearest' }); };\n    strip.onclick = e => { const im = e.target.closest('img[data-i]'); if (im) show(+im.dataset.i); };\n    $('#gMain', root).onclick = () => openLb(p.images, cur);\n    root.querySelectorAll('details[data-raw]').forEach(dt => dt.addEventListener('toggle', () => {\n      const pre = dt.querySelector('pre'); if (dt.open && !pre.textContent) pre.textContent = JSON.stringify(p.raw[dt.dataset.raw], null, 2);\n    }));\n  }\n  // zoomable images (variants, reviews, description, category)\n  root.addEventListener('click', e => {\n    const im = e.target.closest('img[data-zoom]'); if (!im) return;\n    const scope = im.closest('.imgs, #desc, tbody') || root;\n    const list = [...scope.querySelectorAll('img[data-zoom]')].map(x => x.dataset.zoom);\n    openLb(list, list.indexOf(im.dataset.zoom));\n  });\n}\n\n// ---------- lightbox ----------\nconst lb = $('#lb'); let lbList = [], lbI = 0;\nfunction openLb(list, i) { lbList = list; lbShow(Math.max(0, i)); lb.classList.add('on'); }\nfunction lbShow(i) { lbI = (i + lbList.length) % lbList.length; $('img', lb).src = lbList[lbI]; $('.ct', lb).textContent = `${lbI + 1} / ${lbList.length}`; }\nlb.onclick = e => { if (e.target === lb || e.target.classList.contains('x')) lb.classList.remove('on'); };\n$('.pv', lb).onclick = () => lbShow(lbI - 1);\n$('.nx', lb).onclick = () => lbShow(lbI + 1);\naddEventListener('keydown', e => {\n  if (!lb.classList.contains('on')) return;\n  if (e.key === 'Escape') lb.classList.remove('on');\n  if (e.key === 'ArrowLeft') lbShow(lbI - 1);\n  if (e.key === 'ArrowRight') lbShow(lbI + 1);\n});\n\nroute();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "CJ_04", "name": "Pet Collars", "html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>CJ Top 5 · Pet Collars<\/title>\n<style>\n:root{\n  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0eee9; --line:#e2dfd8;\n  --text:#1d1c1a; --muted:#6b6862; --accent:#b4531f; --accent-soft:#f6e6dc;\n  --good:#2f7a4b; --warn:#a36a00; --star:#d99a00;\n  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#161513; --surface:#1f1e1b; --surface-2:#282622; --line:#36332e;\n    --text:#ece9e3; --muted:#9d988f; --accent:#f08a4b; --accent-soft:#3a2517;\n    --good:#6cc28f; --warn:#e2b04a; --star:#f2c14e; --shadow:none;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#161513; --surface:#1f1e1b; --surface-2:#282622; --line:#36332e;\n  --text:#ece9e3; --muted:#9d988f; --accent:#f08a4b; --accent-soft:#3a2517;\n  --good:#6cc28f; --warn:#e2b04a; --star:#f2c14e; --shadow:none rphanVids.length ? `<div class=\"muted\" style=\"font-size:12px;margin-top:6px\">Có ${orphanVids.length} vid chỉ xuất hiện trong dữ liệu tồn kho, không có trong danh sách biến thể: ${orphanVids.map(esc).join(', ')}<\/div>` : ''}\n  <\/div>\n\n  <div class=\"section\"><h2>Tồn kho theo kho<\/h2><div class=\"inv-grid\">${invCards}<\/div><\/div>\n\n  <div class=\"section\"><h2>Mô tả sản phẩm<\/h2><div class=\"card desc\" id=\"desc\"><\/div><\/div>\n\n  <div class=\"section\"><h2>Đánh giá <small>${p.revPartial ? `mới lấy ${p.reviews.length}/${fmt(p.revTotal)}` : p.reviews.length} đánh giá${p.avg ? ` · trung bình ${p.avg.toFixed(2)}` : ''}<\/small><\/h2>\n    ${p.revPartial ? `<div class=\"note\" style=\"margin:0 0 10px\">⚠ Mới lấy được ${p.reviews.length} trên ${fmt(p.revTotal)} đánh giá, nên điểm trung bình và phân bố sao chỉ tính trên phần đã lấy.<\/div>` : ''}\n    ${p.reviews.length ? `<div class=\"card\" style=\"padding:12px 14px;margin-bottom:10px;display:inline-block\"><div class=\"dist\">${dist.map(x => `<div class=\"row\"><span style=\"width:22px\">${x.n}★<\/span><span class=\"bar\"><i style=\"width:${x.c / maxC * 100}%\"><\/i><\/span><span class=\"num\" style=\"width:24px;text-align:right\">${x.c}<\/span><\/div>`).join('')}<\/div><\/div>\n    <div class=\"reviews\">${reviews}<\/div>` : '<div class=\"card empty\">Chưa có đánh giá.<\/div>'}\n  <\/div>\n\n  ${p.videos.length ? `<div class=\"section\"><h2>Video <small>ID video CJ trả về (xem video trên trang sản phẩm CJ)<\/small><\/h2><div class=\"card\" style=\"padding:10px 14px;font-size:12.5px\">${p.videos.map(v => `<div class=\"num muted\">${esc(typeof v === 'string' ? v : JSON.stringify(v))}<\/div>`).join('')}<\/div><\/div>` : ''}\n\n  <div class=\"section\"><h2>Dữ liệu gốc (JSON)<\/h2>\n    ${rawSections.map(k => `<details class=\"card raw\" data-raw=\"${k}\"><summary>${k}<\/summary><pre><\/pre><\/details>`).join('')}\n  <\/div>`;\n}\n\nfunction decodeEnt(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }\n\n// Keep only harmless formatting tags from the CJ description HTML.\nfunction sanitize(html) {\n  const doc = new DOMParser().parseFromString(html || '', 'text/html');\n  const ok = new Set(['P','B','STRONG','I','EM','U','BR','UL','OL','LI','SPAN','DIV','IMG','H1','H2','H3','H4','H5','H6','TABLE','THEAD','TBODY','TR','TD','TH','FONT']);\n  (function walk(n) {\n    for (const c of [...n.children]) {\n      if (!ok.has(c.tagName)) { c.replaceWith(...(['SCRIPT','STYLE','IFRAME','OBJECT'].includes(c.tagName) ? [] : c.childNodes)); continue; }\n      for (const a of [...c.attributes]) if (!(c.tagName === 'IMG' && a.name === 'src' && /^https?:/i.test(a.value))) c.removeAttribute(a.name);\n      if (c.tagName === 'IMG') { c.loading = 'lazy'; c.referrerPolicy = 'no-referrer'; c.dataset.zoom = c.src; }\n      walk(c);\n    }\n  })(doc.body);\n  return doc.body.innerHTML || '<span class=\"muted\">Không có mô tả.<\/span>';\n}\n\n// ---------- category ----------\nfunction renderCategory() {\n  const top = new Set(P.map(p => p.sku));\n  const rows = DATA.catList.map((c, i) => `<tr${top.has(c.sku) ? ' style=\"background:var(--accent-soft)\"' : ''}>\n    <td class=\"r num muted\" data-v=\"${i + 1}\">${i + 1}<\/td>\n    <td>${img(c.bigImage, 'thumb', `data-zoom=\"${esc(c.bigImage)}\"`)}<\/td>\n    <td>${top.has(c.sku) ? `<a href=\"#${c.sku}\"><b>${esc(c.sku)}<\/b><\/a>` : esc(c.sku)}<\/td>\n    <td style=\"min-width:260px\">${esc(c.nameEn)}<\/td>\n    <td class=\"r num\" data-v=\"${c.listedNum ?? 0}\">${fmt(c.listedNum)}<\/td>\n    <td class=\"r num\" style=\"white-space:nowrap\" data-v=\"${parseFloat(c.sellPrice) || 0}\">${esc(String(c.sellPrice ?? '').replace(/\\s*--\\s*/, ' – '))}<\/td>\n    <td class=\"r num\" data-v=\"${c.inv ?? 0}\">${fmt(c.inv)}<\/td>\n    <td class=\"r num\" data-v=\"${c.verified ?? 0}\">${fmt(c.verified)}<\/td>\n    <td>${c.video ? '▶' : ''}<\/td>\n    <td style=\"white-space:nowrap\">${c.url ? `<a href=\"${esc(c.url)}\" target=\"_blank\" rel=\"noopener\">CJ ↗<\/a>` : ''}<\/td>\n  <\/tr>`).join('');\n  return `<div class=\"section\"><h2>Tất cả sản phẩm trong danh mục <small>${DATA.catList.length} sản phẩm · dòng tô màu là top 5 · bấm tiêu đề cột để sắp xếp<\/small><\/h2>\n    <div class=\"toolbar\"><input class=\"search\" id=\"cSearch\" placeholder=\"Lọc theo tên / SKU…\"><\/div>\n    <div class=\"card tbl-wrap\" style=\"max-height:75vh\"><table data-sortable id=\"cTable\">\n      <thead><tr><th class=\"sort r\">#<\/th><th><\/th><th class=\"sort\">SKU<\/th><th class=\"sort\">Tên<\/th><th class=\"sort r\">Shop đã list<\/th><th class=\"sort r\">Giá sỉ<\/th><th class=\"sort r\">Tồn kho<\/th><th class=\"sort r\">Tồn CJ<\/th><th>Video<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${rows}<\/tbody><\/table><\/div><\/div>`;\n}\n\n// ---------- interactions ----------\nfunction makeSortable(tbl) {\n  const ths = [...tbl.tHead.rows[0].cells];\n  ths.forEach((th, idx) => {\n    if (!th.classList.contains('sort')) return;\n    th.addEventListener('click', () => {\n      const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';\n      ths.forEach(h => delete h.dataset.dir); th.dataset.dir = dir;\n      const body = tbl.tBodies[0], rows = [...body.rows];\n      const key = r => { const c = r.cells[idx]; if (!c) return ''; const v = c.dataset.v; return v !== undefined && v !== '' && !isNaN(v) ? +v : c.textContent.trim().toLowerCase(); };\n      rows.sort((a, b) => { const x = key(a), y = key(b); const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y)); return dir === 'asc' ? r : -r; });\n      rows.forEach(r => body.appendChild(r));\n    });\n  });\n}\nfunction filterTable(input, tbl) {\n  input?.addEventListener('input', () => {\n    const q = input.value.trim().toLowerCase();\n    for (const r of tbl.tBodies[0].rows) r.style.display = !q || r.textContent.toLowerCase().includes(q) ? '' : 'none';\n  });\n}\n\nfunction wire(root, id) {\n  root.querySelectorAll('[data-go]').forEach(el => el.onclick = () => location.hash = el.dataset.go);\n  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {\n    try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = 'Đã copy ✓'; setTimeout(() => b.textContent = t, 1200); } catch {}\n  });\n  filterTable($('#vSearch', root), $('#vTable', root));\n  filterTable($('#cSearch', root), $('#cTable', root));\n\n  const p = P.find(x => x.sku === id);\n  if (p) {\n    $('#desc', root).innerHTML = sanitize(p.d.description || p.s.description);\n    let cur = 0;\n    const strip = $('#gStrip', root), main = $('#gMain img', root);\n    const show = i => { cur = i; main.src = p.images[i]; strip.querySelectorAll('img').forEach((im, j) => im.classList.toggle('on', j === i)); strip.children[i]?.scrollIntoView({ block: 'nearest', inline: 'nearest' }); };\n    strip.onclick = e => { const im = e.target.closest('img[data-i]'); if (im) show(+im.dataset.i); };\n    $('#gMain', root).onclick = () => openLb(p.images, cur);\n    root.querySelectorAll('details[data-raw]').forEach(dt => dt.addEventListener('toggle', () => {\n      const pre = dt.querySelector('pre'); if (dt.open && !pre.textContent) pre.textContent = JSON.stringify(p.raw[dt.dataset.raw], null, 2);\n    }));\n  }\n  // zoomable images (variants, reviews, description, category)\n  root.addEventListener('click', e => {\n    const im = e.target.closest('img[data-zoom]'); if (!im) return;\n    const scope = im.closest('.imgs, #desc, tbody') || root;\n    const list = [...scope.querySelectorAll('img[data-zoom]')].map(x => x.dataset.zoom);\n    openLb(list, list.indexOf(im.dataset.zoom));\n  });\n}\n\n// ---------- lightbox ----------\nconst lb = $('#lb'); let lbList = [], lbI = 0;\nfunction openLb(list, i) { lbList = list; lbShow(Math.max(0, i)); lb.classList.add('on'); }\nfunction lbShow(i) { lbI = (i + lbList.length) % lbList.length; $('img', lb).src = lbList[lbI]; $('.ct', lb).textContent = `${lbI + 1} / ${lbList.length}`; }\nlb.onclick = e => { if (e.target === lb || e.target.classList.contains('x')) lb.classList.remove('on'); };\n$('.pv', lb).onclick = () => lbShow(lbI - 1);\n$('.nx', lb).onclick = () => lbShow(lbI + 1);\naddEventListener('keydown', e => {\n  if (!lb.classList.contains('on')) return;\n  if (e.key === 'Escape') lb.classList.remove('on');\n  if (e.key === 'ArrowLeft') lbShow(lbI - 1);\n  if (e.key === 'ArrowRight') lbShow(lbI + 1);\n});\n\nroute();\n<\/script>\n<\/body>\n<\/html>\n"}];
const tabs = document.getElementById('tabs'), main = document.getElementById('main');
const prev = document.getElementById('prev'), next = document.getElementById('next'), count = document.getElementById('count');
const frames = [];
let cur = -1;

CATS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.setAttribute('role', 'tab');
  b.innerHTML = `<b>${c.id}</b><span></span>`;
  b.querySelector('span').textContent = c.name;
  b.onclick = () => go(i);
  tabs.appendChild(b);
});

function frame(i) {
  if (frames[i]) return frames[i];
  const f = document.createElement('iframe');
  f.title = CATS[i].name;
  f.addEventListener('load', () => {
    try { f.contentDocument.addEventListener('keydown', onKey); } catch {}
  });
  f.srcdoc = CATS[i].html;
  main.appendChild(f);
  return frames[i] = f;
}

function go(i, push = true) {
  i = Math.max(0, Math.min(CATS.length - 1, i));
  if (i === cur) return;
  cur = i;
  frame(i);
  frames.forEach((f, j) => f && (f.hidden = j !== i));
  [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', j === i));
  tabs.children[i].scrollIntoView({block: 'nearest', inline: 'nearest'});
  prev.disabled = i === 0; next.disabled = i === CATS.length - 1;
  count.textContent = `${i + 1} / ${CATS.length}`;
  document.title = `${CATS[i].id} · ${CATS[i].name}`;
  if (push) { try { history.replaceState(null, '', '#' + CATS[i].id); } catch {} }
}

function onKey(e) {
  const t = e.target;
  if (e.altKey || e.ctrlKey || e.metaKey || (t && /INPUT|TEXTAREA|SELECT/.test(t.tagName))) return;
  if (e.key === 'ArrowLeft') { go(cur - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { go(cur + 1); e.preventDefault(); }
}
document.addEventListener('keydown', onKey);
prev.onclick = () => go(cur - 1);
next.onclick = () => go(cur + 1);

const fromHash = () => Math.max(0, CATS.findIndex(c => '#' + c.id === location.hash));
window.addEventListener('hashchange', () => go(fromHash(), false));
go(fromHash());
</script>
